name: Sync Intelsol Data (Leads + Stats)

on:
  # Allow manual triggering from GitHub UI or API
  workflow_dispatch:

  # Run daily at 4 AM CEST (2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

jobs:
  sync-intelsol-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests python-dotenv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create credentials files
        run: |
          # Python .env for leads sync
          cat > .env << 'EOF'
          SMARTLEAD_API_KEY=${{ secrets.SMARTLEAD_API_KEY }}
          EOF

          # Node.js credentials for campaign sync
          mkdir -p .smartlead
          cat > .smartlead/credentials.json << 'EOF'
          {
            "apiKey": "${{ secrets.SMARTLEAD_API_KEY }}",
            "baseUrl": "https://server.smartlead.ai/api/v1"
          }
          EOF

      - name: Sync Leads Database
        run: |
          cat > sync_leads.py << 'PYTHON_SCRIPT'
          #!/usr/bin/env python3
          import os
          import csv
          import io
          import requests
          from dotenv import load_dotenv

          load_dotenv()
          API_KEY = os.getenv('SMARTLEAD_API_KEY')
          BASE_URL = 'https://server.smartlead.ai/api/v1'

          print("Fetching Intelsol campaigns...")
          response = requests.get(f"{BASE_URL}/campaigns", params={'api_key': API_KEY})
          campaigns = response.json()

          intelsol_campaigns = [c for c in campaigns if c.get('name', '').startswith('🏆')]
          print(f"Found {len(intelsol_campaigns)} Intelsol campaigns\n")

          all_leads = []
          seen_emails = set()

          for i, camp in enumerate(intelsol_campaigns, 1):
              cid = camp['id']
              name = camp['name']

              print(f"[{i}/{len(intelsol_campaigns)}] {name[:70]}...")

              try:
                  url = f"{BASE_URL}/campaigns/{cid}/leads-export"
                  params = {'api_key': API_KEY}
                  r = requests.get(url, params=params, timeout=30)

                  if r.status_code == 200:
                      csv_content = r.text
                      if csv_content.strip():
                          reader = csv.DictReader(io.StringIO(csv_content))

                          added = 0
                          for row in reader:
                              email = row.get('email', row.get('Email', row.get('EMAIL', '')))

                              if email and email not in seen_emails:
                                  seen_emails.add(email)

                                  all_leads.append({
                                      'first_name': row.get('first_name', row.get('First Name', row.get('firstName', ''))),
                                      'last_name': row.get('last_name', row.get('Last Name', row.get('lastName', ''))),
                                      'email': email,
                                      'company_name': row.get('company_name', row.get('Company Name', row.get('companyName', row.get('company', '')))),
                                      'website': row.get('website', row.get('Website', row.get('companyWebsite', ''))),
                                      'linkedin_url': row.get('linkedin_url', row.get('LinkedIn URL', row.get('linkedinUrl', row.get('linkedin', '')))),
                                      'campaign_name': name
                                  })
                                  added += 1

                          if added > 0:
                              print(f"  ✅ Added {added} leads ({len(all_leads)} total)")
                  else:
                      print(f"  ⚠️  Status {r.status_code}")

              except Exception as e:
                  print(f"  ⚠️  Error: {e}")
                  continue

          print(f"\nTotal unique leads: {len(all_leads)}")

          if all_leads:
              with open('public/data/intelsol-database.csv', 'w', newline='', encoding='utf-8') as f:
                  writer = csv.DictWriter(f, ['first_name', 'last_name', 'email', 'company_name', 'website', 'linkedin_url', 'campaign_name'])
                  writer.writeheader()
                  writer.writerows(all_leads)
              print(f"\n✅ Updated public/data/intelsol-database.csv with {len(all_leads)} unique leads")
          else:
              print(f"\n❌ No leads found")
          PYTHON_SCRIPT

          python3 sync_leads.py

      - name: Sync Campaign Stats
        run: |
          # Filter sync script to only process Intelsol
          cat > .smartlead/sync-intelsol-only.js << 'EOF'
          const syncScript = require('./.smartlead/sync-all-campaigns.js');
          EOF

          node .smartlead/sync-all-campaigns.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code public/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add public/data/intelsol-database.csv public/campaigns/intelsol.json
          git commit -m "Auto-update: Intelsol data sync at $(date -u +'%Y-%m-%d %H:%M UTC')

          - Updated lead database
          - Updated campaign stats

          Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changes != 'true'
        run: echo "No changes detected. Database and stats are up to date."
