name: Sync Campaigns from Smartlead

on:
  # Run daily at 4 AM CEST (2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  sync-campaigns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create credentials file
        run: |
          mkdir -p .smartlead
          cat > .smartlead/credentials.json << 'EOF'
          {
            "apiKey": "${{ secrets.SMARTLEAD_API_KEY }}",
            "baseUrl": "https://server.smartlead.ai/api/v1"
          }
          EOF

      - name: Run campaign sync
        run: node .smartlead/sync-all-campaigns.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code public/campaigns/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add public/campaigns/*.json
          git commit -m "Auto-update: Campaign data sync at $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changes != 'true'
        run: echo "No campaign changes detected. Skipping commit."
