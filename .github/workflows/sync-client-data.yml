name: Sync Client Data (Generic)

on:
  # Allow manual triggering with client parameter
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client ID to sync (intelsol, tslab, xpose, etc.)'
        required: true
        type: choice
        options:
          - intelsol
          - tslab
          - demo
          - xpose
          - adsigner
          - beeit
          - wulf
          - peoplefocus
          - plantryx
          - mountaindrop
          - eblissai
          - zen2fit
          - panorate
          - mbedtronix
          - clevercraft
          - stojkov
          - birografika
          - bmevents
          - prtronic
          - dhm
          - morefromfood
          - selekcija
          - intera
          - all

  # Run daily at 4 AM CEST (2 AM UTC) for all clients
  schedule:
    - cron: '0 2 * * *'

jobs:
  sync-client-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests python-dotenv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Python sync script
        run: |
          cat > sync_client_leads.py << 'PYTHON_SCRIPT'
          #!/usr/bin/env python3
          import os
          import sys
          import csv
          import io
          import re
          import requests

          API_KEY = os.getenv('SMARTLEAD_API_KEY')
          BASE_URL = 'https://server.smartlead.ai/api/v1'

          # Client names for matching (emoji-agnostic)
          CLIENT_NAMES = {
              'intelsol': 'Intelsol',
              'tslab': 'TS Lab',
              'demo': 'Demo',
              'xpose': 'Xpose',
              'adsigner': 'AdSigner',
              'beeit': 'BeeIt',
              'wulf': 'WULF',
              'peoplefocus': 'People Focus',
              'plantryx': 'Plantryx',
              'mountaindrop': 'Mountaindrop',
              'eblissai': 'eBliss AI',
              'zen2fit': 'Zen2fit',
              'panorate': 'Panorate',
              'mbedtronix': 'MBEDTRONIX',
              'clevercraft': 'Clever Craft',
              'stojkov': 'Stojkov',
              'birografika': 'BiroGrafika',
              'bmevents': 'BM Events',
              'prtronic': 'PRTronic',
              'dhm': 'DHM',
              'morefromfood': 'MoreFromFood',
              'selekcija': 'Selekcija',
              'intera': 'Intrix CRM',
          }

          def remove_emoji(text):
              """Remove emoji from text using Unicode ranges"""
              emoji_pattern = re.compile(
                  "["
                  "\U0001F1E0-\U0001F1FF"  # flags
                  "\U0001F300-\U0001F5FF"  # symbols & pictographs
                  "\U0001F600-\U0001F64F"  # emoticons
                  "\U0001F680-\U0001F6FF"  # transport & map
                  "\U0001F700-\U0001F77F"  # alchemical
                  "\U0001F780-\U0001F7FF"  # geometric shapes
                  "\U0001F800-\U0001F8FF"  # arrows
                  "\U0001F900-\U0001F9FF"  # supplemental symbols
                  "\U0001FA00-\U0001FA6F"  # chess
                  "\U0001FA70-\U0001FAFF"  # extended-A
                  "\U00002600-\U000026FF"  # miscellaneous symbols
                  "\U00002700-\U000027BF"  # dingbats
                  "\U0000FE00-\U0000FE0F"  # variation selectors
                  "\U0001F000-\U0001F02F"  # mahjong
                  "\U0001F0A0-\U0001F0FF"  # playing cards
                  "]+", flags=re.UNICODE
              )
              return emoji_pattern.sub('', text).strip()

          def matches_campaign(campaign_name, client_name):
              """Check if campaign matches client name (emoji-agnostic)"""
              without_emoji = remove_emoji(campaign_name)
              normalized_campaign = without_emoji.lower().replace(' ', '').replace('-', '')
              normalized_client = client_name.lower().replace(' ', '').replace('-', '')
              return normalized_campaign.startswith(normalized_client)

          def sync_client(client_id):
              client_name = CLIENT_NAMES.get(client_id)
              if not client_name:
                  print(f"Unknown client: {client_id}")
                  return False

              print(f"\n🔄 Syncing {client_id} ({client_name})...")

              response = requests.get(f"{BASE_URL}/campaigns", params={'api_key': API_KEY})
              campaigns = response.json()

              client_campaigns = [c for c in campaigns if matches_campaign(c.get('name', ''), client_name)]
              print(f"Found {len(client_campaigns)} campaigns")

              if len(client_campaigns) == 0:
                  print(f"⚠️  No campaigns for {client_id}, skipping")
                  return False

              all_leads = []
              seen_emails = set()

              for i, camp in enumerate(client_campaigns, 1):
                  try:
                      url = f"{BASE_URL}/campaigns/{camp['id']}/leads-export"
                      r = requests.get(url, params={'api_key': API_KEY}, timeout=30)

                      if r.status_code == 200 and r.text.strip():
                          reader = csv.DictReader(io.StringIO(r.text))

                          for row in reader:
                              email = row.get('email', row.get('Email', ''))
                              if email and email not in seen_emails:
                                  seen_emails.add(email)
                                  all_leads.append({
                                      'first_name': row.get('first_name', row.get('firstName', '')),
                                      'last_name': row.get('last_name', row.get('lastName', '')),
                                      'email': email,
                                      'company_name': row.get('company_name', row.get('companyName', row.get('company', ''))),
                                      'website': row.get('website', row.get('companyWebsite', '')),
                                      'linkedin_url': row.get('linkedin_url', row.get('linkedinUrl', row.get('linkedin', ''))),
                                      'campaign_name': camp['name']
                                  })
                  except Exception as e:
                      print(f"  Error on campaign {i}: {e}")

              print(f"Total leads: {len(all_leads)}")

              if all_leads:
                  os.makedirs('public/data', exist_ok=True)
                  with open(f'public/data/{client_id}-database.csv', 'w', newline='', encoding='utf-8') as f:
                      writer = csv.DictWriter(f, ['first_name', 'last_name', 'email', 'company_name', 'website', 'linkedin_url', 'campaign_name'])
                      writer.writeheader()
                      writer.writerows(all_leads)
                  print(f"✅ Updated public/data/{client_id}-database.csv")
                  return True

              return False

          if __name__ == '__main__':
              client = sys.argv[1] if len(sys.argv) > 1 else 'all'

              if client == 'all':
                  updated = []
                  for cid in CLIENT_NAMES.keys():
                      if sync_client(cid):
                          updated.append(cid)
                  print(f"\n✅ Updated: {', '.join(updated)}")
              else:
                  sync_client(client)
          PYTHON_SCRIPT

      - name: Determine clients to sync
        id: clients
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.client_id }}" = "all" ]; then
            echo "clients=all" >> $GITHUB_OUTPUT
          else
            echo "clients=${{ github.event.inputs.client_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Sync Leads Database
        env:
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          python3 sync_client_leads.py "${{ steps.clients.outputs.clients }}"

      - name: Sync Campaign Stats
        run: |
          mkdir -p .smartlead
          cat > .smartlead/credentials.json << 'EOF'
          {
            "apiKey": "${{ secrets.SMARTLEAD_API_KEY }}",
            "baseUrl": "https://server.smartlead.ai/api/v1"
          }
          EOF

          node .smartlead/sync-all-campaigns.js

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Upload CSV files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          echo "📦 Uploading CSV files to R2..."

          UPLOADED=0
          FAILED=0

          for file in public/data/*.csv; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading: $filename"

              if wrangler r2 object put "intelsol-client-data/data/$filename" --file="$file"; then
                echo "✓ Success: $filename"
                ((UPLOADED++))
              else
                echo "✗ Failed: $filename"
                ((FAILED++))
              fi
            fi
          done

          echo ""
          echo "=== Upload Complete ==="
          echo "✅ Uploaded: $UPLOADED files"
          if [ $FAILED -gt 0 ]; then
            echo "❌ Failed: $FAILED files"
            exit 1
          fi

      - name: Sync Summary
        run: |
          echo "✅ Client data synced successfully to Cloudflare R2"
          echo "Client: ${{ steps.clients.outputs.clients }}"
          echo "Time: $(date -u +'%Y-%m-%d %H:%M UTC')"
